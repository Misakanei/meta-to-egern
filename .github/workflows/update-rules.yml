name: Mirror MetaCubeX rules for Egern

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-rules.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'groups.json'
      - 'requirements.txt'
  schedule:
    # Beijing time 10:17 every day; GitHub may delay scheduled jobs.
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      asn:
        description: 'Optional ASN CIDRs to publish, e.g. AS13335,AS15169. Empty = full GeoSite+GeoIP mirror.'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sync-metacubex-egern
  cancel-in-progress: false

jobs:
  full-mirror:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.asn == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check out upstream MetaCubeX (sparse; skip huge ASN directory)
        uses: actions/checkout@v4
        with:
          repository: MetaCubeX/meta-rules-dat
          ref: meta
          path: upstream
          sparse-checkout: |
            geo/geosite
            geo/geoip
            geo-lite/geosite
            geo-lite/geoip
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate and mirror every YAML category
        run: |
          python -m unittest discover -s tests -v
          python scripts/convert.py --upstream upstream
      - name: Refresh previously published ASN CIDR snapshots
        run: python scripts/convert_asn.py --refresh
      - name: Commit generated rules and index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A rules/ catalog/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: mirror MetaCubeX GeoSite, GeoIP and published ASN'
            git push
          else
            echo 'Upstream contents unchanged'
          fi

  selected-asn:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.asn != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Publish selected upstream ASN IP prefix rules
        env:
          ASN_SELECTION: ${{ inputs.asn }}
        run: |
          python -m unittest discover -s tests -v
          python scripts/convert_asn.py --asn "$ASN_SELECTION"
      - name: Commit selected ASN categories
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules/asn/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: publish selected ASN prefix rules'
            git push
          else
            echo 'ASN rules unchanged'
          fi
