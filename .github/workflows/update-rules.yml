name: Convert MetaCubeX to Egern
on:
  schedule:
    # Daily 10:17 Beijing time (GitHub may delay scheduled jobs)
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-egern-rules
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate converter and regenerate rules
        run: |
          python -m unittest discover -s tests -v
          python scripts/convert.py
      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync Egern rules from MetaCubeX'
            git push
          else
            echo 'Rules are already up to date'
          fi
